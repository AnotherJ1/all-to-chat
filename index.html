<!doctype html>
<html lang="zh-CN" data-theme="neubrutalism">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool Hub</title>
    <script>
      // 从 localStorage 恢复主题，避免闪烁
      try {
        const stored = JSON.parse(localStorage.getItem('theme-style-storage') || '{}');
        if (stored.state && stored.state.style) {
          document.documentElement.setAttribute('data-theme', stored.state.style);
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
